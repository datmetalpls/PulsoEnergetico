<!doctype html><html lang="es"><meta charset="utf-8"><style>
@font-face{font-family:Fraunces;src:url(../../fonts/Fraunces.woff2)}@font-face{font-family:'DM Sans';src:url(../../fonts/DMSans.woff2)}
html,body{margin:0}body{width:1920px;height:1080px;overflow:hidden;position:relative;
background:radial-gradient(1200px 900px at 78% 50%,#0B4450 0%,#06323B 55%,#042830 100%);color:#FFF1D9;font-family:'DM Sans'}
.frame{position:absolute;inset:36px;border:3px solid #FFC04C;border-radius:6px}
.frame:after{content:"";position:absolute;inset:10px;border:1.5px solid rgba(255,241,217,.35);border-radius:3px}
.txt{position:absolute;left:150px;top:0;bottom:0;width:860px;display:flex;flex-direction:column;justify-content:center}
.k{display:flex;align-items:center;gap:22px;font-weight:700;letter-spacing:.24em;font-size:30px;color:#FFC04C}
.k i{display:block;width:70px;height:3px;background:#FFC04C;border-radius:2px}
.k em{font-style:normal;color:#D9643A}
h1{font-family:Fraunces;font-weight:700;font-size:150px;line-height:.95;margin:36px 0 34px;font-variation-settings:"SOFT" 50,"opsz" 144;letter-spacing:-.01em}
h1 span{color:#FFC04C;font-style:italic;font-weight:600}
p{font-size:44px;margin:0;color:#FFF1D9;opacity:.92}
.rule{margin-top:46px;display:flex;gap:14px;align-items:center;font-size:22px;letter-spacing:.2em;color:#83D9AA;font-weight:600}
.rule b{width:10px;height:10px;background:#D9643A;transform:rotate(45deg)}
.sello{position:absolute;right:120px;top:50%;width:760px;height:760px;transform:translateY(-50%);filter:drop-shadow(0 24px 50px rgba(0,0,0,.35))}
</style><body><div class="frame"></div>
<div class="txt"><div class="k"><i></i>HACKATÓN ECUADOR <em>×</em> CHILE</div>
<h1>Pulso<br><span>Energético</span></h1>
<p>La energía de tu sede, a la vista.</p>
<div class="rule"><b></b>ODS 7 · ENERGÍA ASEQUIBLE Y NO CONTAMINANTE</div></div>
<div class="sello"><img src="sello-completo.svg" alt="Sello Pulso Energético" style="width:100%;height:100%;display:block;clip-path:circle(48.1%)"></div>
</body></html>
