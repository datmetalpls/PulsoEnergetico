services:
  db:
    image: postgres:17-alpine
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [database]
  web:
    build: .
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [default, database]
networks:
  database:
    internal: true
volumes:
  postgres_data:
